name: Talkora AI Pilot Tests

on:
  pull_request:
    paths:
      - 'talkora-ai-starter/**'
      - '.github/workflows/ai-python-checks.yml'
  push:
    branches: [main]
    paths:
      - 'talkora-ai-starter/**'
      - '.github/workflows/ai-python-checks.yml'

jobs:
  class1-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API and test dependencies
        working-directory: talkora-ai-starter
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run offline Python safety tests (no datasets or model downloads)
        working-directory: talkora-ai-starter
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          TALKORA_ENV: test
          TALKORA_CLASS1_HINTS_APPROVED: 'false'
        run: python -m pytest -q tests

name: Talkora AI Pilot Tests

on:
  pull_request:
    paths:
      - 'talkora-ai-starter/**'
      - 'priya-service/**'
      - '.github/workflows/ai-python-checks.yml'
  push:
    branches: [main]
    paths:
      - 'talkora-ai-starter/**'
      - 'priya-service/**'
      - '.github/workflows/ai-python-checks.yml'

jobs:
  class1-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API and test dependencies
        working-directory: talkora-ai-starter
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run offline Python safety tests (no datasets or model downloads)
        working-directory: talkora-ai-starter
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          TALKORA_ENV: test
          TALKORA_CLASS1_HINTS_APPROVED: 'false'
        run: python -m pytest -q tests

  priya-8001-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal API/test packages (no torch or model downloads)
        run: |
          python -m pip install fastapi==0.116.1 httpx==0.28.1 python-multipart==0.0.20 pydantic-settings==2.10.1 soundfile==0.13.1
      - name: Verify 8001 health and sanitized TTS exceptions
        working-directory: priya-service
        run: python -m unittest discover -s tests -p 'test_priya_8001_contract.py' -v
